<?xml version="1.0" encoding="UTF-8"?>
<!-- Simple decorative vector illustration (abstract physiotherapy blob) -->
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feMerge><feMergeNode in="off"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#f1)">
    <path d="M120 360C60 300 40 220 110 170C180 120 300 120 380 130C460 140 600 180 660 240C720 300 740 380 670 430C600 480 460 500 380 480C300 460 180 420 120 360Z" fill="url(#g1)" opacity="0.95"/>
  </g>

  <!-- small figure / icon to imply care -->
  <g transform="translate(420,210)">
    <circle cx="0" cy="-10" r="20" fill="#fff" opacity="0.95"/>
    <rect x="-6" y="10" width="12" height="30" rx="6" fill="#fff" opacity="0.95"/>
    <path d="M-18 20 Q -8 4 0 10 Q 8 4 18 20" fill="#fff" opacity="0.95"/>
  </g>

</svg>
